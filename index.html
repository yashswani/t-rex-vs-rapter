<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Rex Chomp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="background-container"></div>
        <div id="trex" class="game-char"></div>
        <div id="ui-container">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div id="special-attack-status">Special Attack Ready! (Enter)</div>
        </div>
        <div id="start-screen">
            <h1>T-Rex Chomp!</h1>
            <p>Use Up/Down Arrow keys to move. Press Spacebar to chomp the raptors!</p>
            <button id="start-button">Start Game</button>
        </div>
        <div id="game-over-screen">
            <h1>Game Over!</h1>
            <p>Your final score is: <span id="final-score">0</span></p>
            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script src="scripts.js"></script>

</body>
</html>
